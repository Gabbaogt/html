<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de Iframe</title>
</head>
<body>  
    <h1>Testando o uso de um Iframe</h1>
    <p>
        Acessando o site do <br>
        <!-- Tamenho Padrão 300x150 -->
        <iframe src="https://www.cursoemvideo.com" frameborder="0" width="100%" height="500em" style="border-radius: 5%; box-shadow: 5px 5px 5px black;">
            <a href="https://www.cursoemvideo.com" target="_blank">Curso em Vídeo</a>
        </iframe><br>
        para aprende a programar.
    </p>
    <p>
        O site da Wikipédia <br>
        <iframe src="https://www.wikipedia.com" frameborder="0" width="100%" height="500em" style=" border-radius: 5%; box-shadow: 5px 5px 5px black;"></iframe> <br>
        é muito legal para conteúdos históricos
    </p>
</body>
</html>
